    <title>you-brain</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%224%22%20y1%3D%222%22%20x2%3D%2230%22%20y2%3D%2230%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%236E67F2%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%233A32A8%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227.2%22%20fill%3D%22url%28%23g%29%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216.40%22%20r%3D%224.85%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.70%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216.40%22%20r%3D%222.35%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2216.00%22%20cy%3D%226.10%22%20r%3D%222.70%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2225.80%22%20cy%3D%2213.22%22%20r%3D%222.30%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2222.05%22%20cy%3D%2224.73%22%20r%3D%222.55%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%229.95%22%20cy%3D%2224.73%22%20r%3D%222.25%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%226.20%22%20cy%3D%2213.22%22%20r%3D%222.45%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E" />
    <script>
      (function () {
        var key = "you-brain-theme";
        var query = new URLSearchParams(location.search).get("theme");
        var choice = query === "light" || query === "dark" || query === "system" ? query : null;
        try {
          if (choice) localStorage.setItem(key, choice);
          else choice = localStorage.getItem(key);
        } catch (error) {
          choice = choice || "system";
        }
        if (choice !== "light" && choice !== "dark" && choice !== "system") choice = "system";
        var dark =
          choice === "dark" ||
          (choice !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
