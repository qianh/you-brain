<!-- you-brain app icon. 1024 canvas, 824 squircle. Lucide brain (ISC) + three thought dots. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="210" y1="150" x2="860" y2="910">
      <stop offset="0" stop-color="#8E89F6"/>
      <stop offset="0.40" stop-color="#564EE6"/>
      <stop offset="0.74" stop-color="#3E36B4"/>
      <stop offset="1" stop-color="#2C2674"/>
    </linearGradient>
    <radialGradient id="sheen" gradientUnits="userSpaceOnUse" cx="390" cy="250" r="460">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" gradientUnits="userSpaceOnUse" cx="690" cy="880" r="520">
      <stop offset="0" stop-color="#140E40" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#140E40" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="512" y1="100" x2="512" y2="924">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>
    <rect width="1024" height="1024" fill="url(#shade)"/>
    <!-- Lucide brain, 24 grid. scale 21.6 → visual width ~469px (57% of the 824 squircle); stroke 1.7 × 21.6 ≈ 37px. -->
    <g transform="translate(252.8 252.8) scale(21.6)" fill="#fff" fill-opacity="0.15" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 18V5"/>
      <path d="M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4"/>
      <path d="M17.707 6.294A3 3 0 1012 5a3 3 0 10-5.707 1.294"/>
      <path d="M17.996 5.125a4 4 0 012.526 5.77"/>
      <path d="M18 18a4 4 0 002-7.465"/>
      <path d="M19.967 17.482a4 4 0 11-7.967.517 4 4 0 11-7.967-.517"/>
      <path d="M6 18a4 4 0 01-2-7.465"/>
      <path d="M6.004 5.125a4 4 0 00-2.526 5.77"/>
    </g>
    <g fill="#fff">
      <circle cx="712" cy="328" r="14"/>
      <circle cx="756" cy="284" r="22"/>
      <circle cx="812" cy="228" r="32"/>
    </g>
    <rect x="100" y="100" width="824" height="824" rx="184" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
